# Clockin A7 test boot. The stock M4 boot remains selectable from the serial menu.
MENU TITLE STM32MP157F-DK2 Clockin boot
MENU BACKGROUND /splash_landscape.bmp
DEFAULT clockin-a7-test
TIMEOUT 50

LABEL clockin-a7-test
	MENU LABEL Clockin A7 hardware test
	KERNEL /uImage
	FDT /stm32mp157f-dk2-clockin.dtb
	INITRD /st-image-resize-initrd
	APPEND root=PARTUUID=e91c4e10-16e6-4c0e-bd0e-77becf4a3582 rootwait rw console=${console},${baudrate} systemd.mask=m4-autostart.service

LABEL stock-m4
	MENU LABEL Stock board with M4 firmware
	KERNEL /uImage
	FDT /stm32mp157f-dk2.dtb
	INITRD /st-image-resize-initrd
	APPEND root=PARTUUID=e91c4e10-16e6-4c0e-bd0e-77becf4a3582 rootwait rw console=${console},${baudrate}
